<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Live Captions</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8a8f98;
    --accent: #ffd60a;
    --bar: #16181c;
    --btn: #2a2d33;
    --size: 56px;
    color-scheme: dark;
  }
  :root.light {
    --bg: #fff;
    --fg: #000;
    --dim: #6b7079;
    --accent: #0a58ff;
    --bar: #f0f1f3;
    --btn: #dfe1e5;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  #stage {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 20px max(20px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    transition: transform .3s ease;
  }
  body.flipped #stage { transform: rotate(180deg); }
  #text {
    font-size: var(--size);
    line-height: 1.18;
    font-weight: 700;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  #text .old { color: var(--dim); }
  #text .interim { color: var(--accent); }
  #source { font-size: 20px; line-height: 1.3; color: var(--dim); margin-top: 10px; overflow-wrap: anywhere; }
  body.zh #text { font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
  #zh.on { background: var(--accent); color: var(--bg); }
  #hint { font-size: 28px; font-weight: 600; color: var(--dim); line-height: 1.3; }
  #hint small { display: block; font-size: 17px; font-weight: 400; margin-top: 12px; }
  #bar {
    background: var(--bar);
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  button {
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    color: var(--fg);
    background: var(--btn);
    border: 0;
    border-radius: 12px;
    min-height: 52px;
    min-width: 52px;
    padding: 0 14px;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { opacity: .7; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #bar { flex-wrap: wrap; }
  #bar button:not(#toggle) { flex: 1 1 0; min-width: 0; padding: 0 4px; }
  #toggle { flex: 1 0 100%; order: -1; font-size: 20px; background: #1f9d55; color: #fff; }
  #toggle.on { background: #d62f2f; }
  #status { font-size: 13px; color: var(--dim); text-align: center; padding: 4px 0 0; background: var(--bar); }
  @media (prefers-reduced-motion: reduce) { #stage { transition: none; } }
</style>
</head>
<body>
  <div id="stage">
    <div id="hint">Tap <b>Start</b> and speak.<br>Your words appear here in large letters.
      <small>Use A− / A+ to change text size. 中文 shows the words translated into Simplified Chinese. ⇅ flips the text upside-down for someone sitting across from you.</small>
    </div>
    <div id="text" aria-live="polite"></div>
    <div id="source" hidden></div>
  </div>
  <div id="status">Ready</div>
  <div id="bar">
    <button id="smaller" aria-label="Smaller text">A−</button>
    <button id="bigger" aria-label="Bigger text">A+</button>
    <button id="toggle">Start</button>
    <button id="zh" aria-label="Translate to Simplified Chinese">中文</button>
    <button id="flip" aria-label="Flip text">⇅</button>
    <button id="theme" aria-label="Light or dark">◐</button>
    <button id="clear" aria-label="Clear text">✕</button>
  </div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = (id) => document.getElementById(id);
  const textEl = $("text"), hintEl = $("hint"), statusEl = $("status"), toggleBtn = $("toggle");

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let size = store.get("lc.size", 56);
  let light = store.get("lc.light", false);
  let finals = [];          // finished sentences: {en, zh}
  let zhMode = store.get("lc.zh", false);
  let interimZh = "";
  let interimTimer = null;
  let interim = "";
  let wanted = false;       // user wants it running
  let rec = null;
  let wakeLock = null;

  function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("lc.size", size); }
  function applyTheme() {
    document.documentElement.classList.toggle("light", light);
    document.querySelector('meta[name="theme-color"]').content = light ? "#ffffff" : "#000000";
    store.set("lc.light", light);
  }
  applySize(); applyTheme();

  // Translation: Google's free endpoint first, MyMemory as fallback
  const cache = new Map();
  async function translate(text) {
    if (cache.has(text)) return cache.get(text);
    const q = encodeURIComponent(text);
    let out = null;
    try {
      const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=" + q);
      if (r.ok) { const j = await r.json(); out = j[0].map((x) => x[0]).join(""); }
    } catch (e) {}
    if (!out) {
      try {
        const r = await fetch("https://api.mymemory.translated.net/get?langpair=en|zh-CN&q=" + q);
        if (r.ok) { const j = await r.json(); if (j.responseStatus === 200) out = j.responseData.translatedText; }
      } catch (e) {}
    }
    if (out) cache.set(text, out);
    else setStatus("Translation failed — check your internet connection");
    return out;
  }
  function translateFinal(item) {
    if (!zhMode || item.zh || item.pending) return;
    item.pending = true;
    translate(item.en).then((zh) => { item.pending = false; if (zh) { item.zh = zh; render(); } });
  }
  function scheduleInterim() {
    clearTimeout(interimTimer);
    if (!zhMode || !interim) { interimZh = ""; return; }
    const snap = interim;
    interimTimer = setTimeout(() => {
      translate(snap).then((zh) => { if (zh && interim === snap) { interimZh = zh; render(); } });
    }, 900);
  }
  function addFinal(t) {
    const item = { en: t.charAt(0).toUpperCase() + t.slice(1), zh: "" };
    finals.push(item);
    if (finals.length > 50) finals = finals.slice(-50);
    translateFinal(item);
  }

  function render() {
    hintEl.hidden = finals.length > 0 || interim.length > 0;
    textEl.textContent = "";
    // keep the last few sentences; older ones are dimmed
    const keep = finals.slice(-6);
    const shown = (f) => zhMode ? (f.zh || "…") : f.en;
    keep.forEach((f, i) => {
      const span = document.createElement("span");
      if (i < keep.length - 1 || interim) span.className = "old";
      span.textContent = shown(f) + (zhMode ? "" : " ");
      textEl.appendChild(span);
    });
    if (interim) {
      const span = document.createElement("span");
      span.className = "interim";
      span.textContent = zhMode ? (interimZh || "…") : interim;
      textEl.appendChild(span);
    }
    // In Chinese mode, show the recognised English small underneath so the speaker can check it
    const src = $("source");
    const last = interim || (finals.length ? finals[finals.length - 1].en : "");
    src.hidden = !zhMode || !last;
    src.textContent = last;
    const stage = $("stage");
    stage.scrollTop = stage.scrollHeight;
  }

  function setStatus(s) { statusEl.textContent = s; }

  async function keepAwake() {
    try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (wanted && document.visibilityState === "visible") keepAwake(); });

  function startRec() {
    rec = new SR();
    rec.lang = "en-US";
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = () => setStatus("Listening…");
    rec.onresult = (e) => {
      let live = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        const t = r[0].transcript.trim();
        if (!t) continue;
        if (r.isFinal) {
          addFinal(t);
        } else {
          live += (live ? " " : "") + t;
        }
      }
      if (live !== interim) { interim = live; interimZh = ""; scheduleInterim(); }
      render();
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        wanted = false;
        setStatus("Microphone or speech recognition is blocked. On iPhone: Settings → Safari → Microphone, and turn on Siri & Dictation.");
        updateBtn();
      } else if (e.error !== "no-speech" && e.error !== "aborted") {
        setStatus("Error: " + e.error + " — retrying");
      }
    };
    rec.onend = () => {
      // Safari stops after pauses; restart automatically while the user wants it on
      if (interim) { addFinal(interim); interim = ""; interimZh = ""; render(); }
      if (wanted) setTimeout(() => { if (wanted) { try { startRec(); } catch (e) {} } }, 250);
      else setStatus("Stopped");
    };
    rec.start();
  }

  function updateBtn() {
    toggleBtn.textContent = wanted ? "Stop" : "Start";
    toggleBtn.classList.toggle("on", wanted);
  }

  toggleBtn.addEventListener("click", () => {
    if (!SR) {
      setStatus("This browser has no speech recognition. Use Safari on iPhone, or Chrome on a computer/Android.");
      return;
    }
    wanted = !wanted;
    updateBtn();
    if (wanted) { keepAwake(); try { startRec(); } catch (e) { setStatus("Could not start: " + e.message); } }
    else { try { rec && rec.stop(); } catch (e) {} if (wakeLock) { wakeLock.release(); wakeLock = null; } }
  });

  $("bigger").addEventListener("click", () => { size = Math.min(160, size + 8); applySize(); render(); });
  $("smaller").addEventListener("click", () => { size = Math.max(24, size - 8); applySize(); render(); });
  $("flip").addEventListener("click", () => document.body.classList.toggle("flipped"));
  $("theme").addEventListener("click", () => { light = !light; applyTheme(); });
  $("clear").addEventListener("click", () => { finals = []; interim = ""; interimZh = ""; render(); });
  function applyZh() {
    document.body.classList.toggle("zh", zhMode);
    $("zh").classList.toggle("on", zhMode);
    store.set("lc.zh", zhMode);
    if (zhMode) { finals.slice(-6).forEach(translateFinal); scheduleInterim(); }
    render();
  }
  $("zh").addEventListener("click", () => { zhMode = !zhMode; applyZh(); });
  applyZh();

  if (!SR) setStatus("Speech recognition not supported here. Open in Safari (iPhone) or Chrome.");
})();
</script>
</body>
</html>
